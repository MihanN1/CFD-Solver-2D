# Builds every binary the project has, on real hardware for each system, and
# assembles release/<version> out of them. Installers are deliberately not
# built here - they are a separate step you run when you want them.
#
#   Actions -> Build every binary -> Run workflow (leave version empty)
#   or push a tag v0.2, which uses 0.2 and attaches the files to that
#   tag's release.
#
# What comes out, 34 rows in total:
#   windows-x64    AVX2 {on,off} x OpenMP {on,off} x CUDA {on,off} = 8
#   windows-x86    AVX2 {on,off} x OpenMP {on,off}                 = 4
#   windows-arm64  OpenMP {on,off}                                 = 2
#   linux-x64      AVX2 {on,off} x OpenMP {on,off} x CUDA {on,off} = 8
#   linux-x86      AVX2 {on,off} x OpenMP {on,off}                 = 4
#   linux-arm64    OpenMP {on,off}                                 = 2
#   macos-arm64    OpenMP {on,off}                                 = 2
#   macos-x64      AVX2 {on,off} x OpenMP {on,off}                 = 4
#
# AVX2 is an x86 instruction set, so the ARM rows do not have it; the CUDA
# toolkit has no Windows-on-ARM target and 32-bit CUDA has not existed since
# CUDA 9, so those rows do not either. The arm64 Linux rows are cross-built
# inside the same container with crossbuild-essential-arm64, and the arm64
# Windows rows are cross-built by MSVC, which is what "-A ARM64" means.
#
# Neither Mac cross-builds for the other: each keeps only the rows it produced
# natively and the two artifacts are merged at the end, so no libomp has to be
# fetched for an architecture the runner is not.

name: Build every binary

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Leave empty to use the version in CMakeLists.txt, which is where it
          actually lives. Fill it in only to override that for one run.
        default: ""
        required: false
  push:
    tags: ["v*"]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.pick.outputs.value }}
    steps:
      # Only here to read CMakeLists.txt.
      - uses: actions/checkout@v4
      - id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ inputs.version }}"
          fi
          if [ -z "$v" ]; then
            v=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9]\+\.[0-9]\+\).*/\1/p' \
                CMakeLists.txt | head -1)
          fi
          if [ -z "$v" ]; then
            echo "::error::no version given and none found in CMakeLists.txt"
            exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

  # The solver's own test suite, on the one row that needs no special hardware.
  # A release that does not compute correctly is worse than no release, and
  # before this job existed the matrix only ever checked that it linked.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the tests
        run: |
          set -euo pipefail
          cmake -S . -B build-tests \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCFD_ENABLE_CUDA=OFF \
            -DCFD_STATIC=OFF
          cmake --build build-tests --parallel
          ctest --test-dir build-tests --output-on-failure

  # An image old enough that the binaries also start on distributions older
  # than the runner, with nvcc already in it. No GPU is needed to compile CUDA.
  linux:
    needs: [version, tests]
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu20.04
    # Without these, tzdata's postinstall asks which continent you live in and
    # the job hangs there until it times out. There is nobody to answer.
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - name: Prepare the container for checkout
        run: |
          set -e
          ln -snf /usr/share/zoneinfo/Etc/UTC /etc/localtime
          echo Etc/UTC > /etc/timezone
          apt-get update -qq
          apt-get install -y -qq tzdata git
          git config --global --add safe.directory '*'

      # The aarch64 rows are cross-built here rather than on an ARM runner, so
      # every Linux row comes out of the same old-glibc image and therefore
      # starts on the same range of distributions.
      - name: The aarch64 cross toolchain
        run: apt-get install -y -qq crossbuild-essential-arm64 || true

      - uses: actions/checkout@v4

      - name: Build the 14 Linux rows
        run: bash scripts/make-release.sh "${{ needs.version.outputs.value }}" --only=build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-linux
          path: logs/
          if-no-files-found: ignore

  windows:
    needs: [version, tests]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.6.3"
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration", "thrust"]'

      # The version here has to match the one installed above. It used to say
      # v13.2 while the step above asked for 12.6.3, so nvcc was never on PATH
      # and the four CUDA rows were quietly skipped in every run.
      - name: Add CUDA to PATH
        run: echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build the 14 Windows rows
        shell: pwsh
        run: |
          .\scripts\make-release.ps1 `
            -Version "${{ needs.version.outputs.value }}" `
            -Generator "Visual Studio 17 2022" `
            -Only Build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-windows
          path: logs/
          if-no-files-found: ignore

  macos-arm64:
    needs: [version, tests]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the macOS rows
        run: bash scripts/make-release.sh "${{ needs.version.outputs.value }}" --only=build

      # Whatever it cross-built for Intel is thrown away: the Intel runner
      # below produces those natively, with its own libomp.
      - name: Keep only what this Mac built natively
        run: rm -f "dist/Fluid Solver ${{ needs.version.outputs.value }} macos-x64 "*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-arm64
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-macos-arm64
          path: logs/
          if-no-files-found: ignore

  macos-intel:
    needs: [version, tests]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Build the macOS rows
        run: bash scripts/make-release.sh "${{ needs.version.outputs.value }}" --only=build

      - name: Keep only what this Mac built natively
        run: rm -f "dist/Fluid Solver ${{ needs.version.outputs.value }} macos-arm64 "*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-x64
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-macos-x64
          path: logs/
          if-no-files-found: ignore

  package:
    needs: [version, linux, windows, macos-arm64, macos-intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect every dist
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: What came back
        run: ls -1 dist

      - name: Assemble release/${{ needs.version.outputs.value }}
        run: bash scripts/make-release.sh "${{ needs.version.outputs.value }}" --only=package

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error

      # Only when a tag was pushed. gh is already on the runner, so this needs
      # no third-party action.
      - name: Attach the files to the tag's release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.value }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Fluid Solver $V" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/"$V"/* --clobber
