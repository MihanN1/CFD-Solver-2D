name: Build every UI binary

# This workflow intentionally lives only in the UI branch.
# A push to GUI-part_2 starts the full 34-archive build automatically.
# A tag ui-vX.Y builds the same matrix and publishes the archives to a GitHub Release.
on:
  # Run it by hand from the Actions tab. Without this the only way to rebuild
  # the matrix is to push another commit, which is a silly thing to have to do
  # when a runner died or a version needs changing.
  workflow_dispatch:
    inputs:
      version:
        description: >
          Leave empty to use the version in CMakeLists.txt, which is where it
          actually lives. It has to match the solver release these archives are
          merged into - that is the key merge-ui-release.py pairs them by.
        default: ""
        required: false
  push:
    branches:
      - GUI-part_2
    tags:
      - "ui-v*"

permissions:
  contents: read

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.pick.outputs.value }}
    steps:
      # Only here to read CMakeLists.txt. A hardcoded default in this file is a
      # second place the version lives, and a second place is a place to drift.
      - uses: actions/checkout@v4
      - id: pick
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == ui-v* ]]; then
            version="${GITHUB_REF_NAME#ui-v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          else
            version=$(sed -n \
              's/^[[:space:]]*VERSION[[:space:]]\+\([0-9]\+\.[0-9]\+\).*/\1/p' \
              CMakeLists.txt | head -1)
          fi

          if [[ -z "$version" ]]; then
            echo "No version given and none found in CMakeLists.txt" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building UI release version: $version"

  windows:
    name: Windows x64 + x86 + arm64
    needs: version
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout UI branch/tag
        uses: actions/checkout@v4

      - name: Show tool versions
        shell: pwsh
        run: |
          python --version
          cmake --version

      - name: Build and package Windows UI archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/build-ui-release.py `
            --version "${{ needs.version.outputs.value }}" `
            --generator "Visual Studio 17 2022" `
            --arch x64 `
            --arch x86 `
            --arch arm64 `
            --output dist-ui

      - name: Upload Windows archives
        uses: actions/upload-artifact@v4
        with:
          name: ui-windows
          path: dist-ui/*.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 + x86 + arm64
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout UI branch/tag
        uses: actions/checkout@v4

      - name: Install Linux x64/x86/arm64 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            g++-multilib \
            pkg-config \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libudev-dev \
            libgl1-mesa-dev \
            libx11-dev:i386 \
            libxrandr-dev:i386 \
            libxcursor-dev:i386 \
            libxi-dev:i386 \
            libudev-dev:i386 \
            libgl1-mesa-dev:i386

      # The arm64 rows are cross-built here rather than on an ARM runner, so
      # every Linux row comes out of the same image and starts on the same
      # range of distributions. SFML needs its X11 and GL headers for the
      # target architecture too, which is what the :arm64 packages are.
      - name: Install the aarch64 cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          # The default sources only serve amd64/i386; arm64 lives on ports.
          sudo sed -i 's/^deb \(http\|mirror\)/deb [arch=amd64,i386] \1/' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe" |
            sudo tee /etc/apt/sources.list.d/arm64-ports.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe" |
            sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            crossbuild-essential-arm64 \
            libx11-dev:arm64 \
            libxrandr-dev:arm64 \
            libxcursor-dev:arm64 \
            libxi-dev:arm64 \
            libudev-dev:arm64 \
            libgl1-mesa-dev:arm64

      - name: Show tool versions
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          cmake --version
          g++ --version

      - name: Build and package Linux UI archives
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-ui-release.py \
            --version "${{ needs.version.outputs.value }}" \
            --arch x64 \
            --arch x86 \
            --arch arm64 \
            --output dist-ui

      - name: Upload Linux archives
        uses: actions/upload-artifact@v4
        with:
          name: ui-linux
          path: dist-ui/*.zip
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    name: macOS arm64
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout UI branch/tag
        uses: actions/checkout@v4

      - name: Install libomp for the OpenMP rows
        shell: bash
        run: |
          set -euo pipefail
          # AppleClang carries no OpenMP runtime of its own. The release script
          # installs this itself if it is missing, so this step only makes the
          # dependency visible in the log and saves a minute on the first row.
          brew install libomp || true
          brew --prefix libomp

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          python3 --version
          cmake --version

      - name: Build and package macOS arm64 UI archives
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-ui-release.py \
            --version "${{ needs.version.outputs.value }}" \
            --arch arm64 \
            --output dist-ui

      - name: Upload macOS arm64 archives
        uses: actions/upload-artifact@v4
        with:
          name: ui-macos-arm64
          path: dist-ui/*.zip
          if-no-files-found: error
          retention-days: 14

  macos-x64:
    name: macOS x64
    needs: version
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout UI branch/tag
        uses: actions/checkout@v4

      - name: Install libomp for the OpenMP rows
        shell: bash
        run: |
          set -euo pipefail
          # AppleClang carries no OpenMP runtime of its own. The release script
          # installs this itself if it is missing, so this step only makes the
          # dependency visible in the log and saves a minute on the first row.
          brew install libomp || true
          brew --prefix libomp

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          python3 --version
          cmake --version

      - name: Build and package macOS x64 UI archives
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-ui-release.py \
            --version "${{ needs.version.outputs.value }}" \
            --arch x64 \
            --output dist-ui

      - name: Upload macOS x64 archives
        uses: actions/upload-artifact@v4
        with:
          name: ui-macos-x64
          path: dist-ui/*.zip
          if-no-files-found: error
          retention-days: 14

  package:
    name: Verify and collect all 34 archives
    needs:
      - version
      - windows
      - linux
      - macos-arm64
      - macos-x64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout UI branch/tag
        uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ui-*
          merge-multiple: true
          path: release/${{ needs.version.outputs.value }}

      - name: Verify the exact archive matrix and finalize release
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-ui-release.py \
            --version "${{ needs.version.outputs.value }}" \
            --finalize "release/${{ needs.version.outputs.value }}"

      - name: List final files
        shell: bash
        run: |
          set -euo pipefail
          find "release/${{ needs.version.outputs.value }}" -maxdepth 1 -type f -printf '%f\n' | sort

      # Every row is named for what is in it, so an archive that is missing its
      # binary, or that carries one built without the feature its name promises,
      # must fail here rather than reach a release.
      - name: Check every archive carries a UI binary
        shell: bash
        run: |
          set -euo pipefail
          cd "release/${{ needs.version.outputs.value }}"
          bad=0
          for archive in "Fluid Solver "*-ui.zip; do
            if ! unzip -l "$archive" | grep -qE 'Fluid Solver UI(\.exe)?$'; then
              echo "::error::$archive has no UI executable in it"
              bad=1
            fi
          done
          [ "$bad" = 0 ]
          echo "all $(ls -1 "Fluid Solver "*-ui.zip | wc -l) archives carry a UI binary"

      - name: Upload complete UI release
        uses: actions/upload-artifact@v4
        with:
          name: ui-release-${{ needs.version.outputs.value }}
          path: release/${{ needs.version.outputs.value }}/
          if-no-files-found: error
          retention-days: 14

      - name: Create/update GitHub Release for ui-v* tag
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'ui-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "Fluid Solver UI $VERSION" \
              --generate-notes

          gh release upload "$GITHUB_REF_NAME" \
            release/"$VERSION"/* \
            --clobber
